name: Health Check

on:
  schedule:
    - cron: '30 */6 * * *'  # Every 6 hours (offset from mortgage)
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          set +e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "http://18.195.171.220/trade/" 2>/dev/null)
          echo "HTTP $CODE"
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
            echo "App is healthy"
          else
            echo "WARNING: App may be down (HTTP $CODE)"
            exit 1
          fi
